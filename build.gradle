cd ~/Volitionary

# 1. Kafamızı karıştıran ve hata veren kök build.gradle dosyasını siliyoruz
rm build.gradle

# 2. settings.gradle dosyasını tüm eklenti depolarını yönetecek şekilde yeniden ve eksiksiz yazıyoruz
cat << 'EOF' > settings.gradle
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "Volitionary"
include ':app'
EOF
